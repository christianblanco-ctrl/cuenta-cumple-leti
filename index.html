<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta del cumple de Leti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6f6a61; --line:#e6e1d6;
    --accent:#d9480f; --accent-soft:#fff0e6; --ok:#2b8a3e; --ok-soft:#e9f7ec;
    --warn:#b35c00; --warn-soft:#fff4e0; --info:#1c64b8; --info-soft:#e8f1fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151412; --card:#1f1d1a; --ink:#f1ede6; --muted:#a39d92; --line:#34312c;
      --accent:#ff7a3d; --accent-soft:#3a2418; --ok:#63c77a; --ok-soft:#1c2e21;
      --warn:#f0a44b; --warn-soft:#352715; --info:#6aa8f0; --info-soft:#18263a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:110px}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{padding:22px 0 8px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .banner{margin:12px 0;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.info{background:var(--info-soft);color:var(--info)}
  .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
  .people{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
  .chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin:18px 0 6px}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:9px;border-radius:9px;cursor:pointer}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .name{font-weight:600;font-size:15px}
  .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .stepper{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
  .stepper button{width:34px;height:34px;border:0;border-radius:8px;background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper .n{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .claims{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
  .tag.me{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .status{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
  .status.ok{background:var(--ok-soft);color:var(--ok)}
  .status.pend{background:var(--warn-soft);color:var(--warn)}
  .status.share{background:var(--info-soft);color:var(--info)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
  .big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
  .line.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .line .m{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  tr.tot td{font-weight:700;border-bottom:0}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;padding:0}
  .bar .who{font-size:13px;color:var(--muted)}
  .bar .amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .save{font-size:12px;color:var(--muted);text-align:right}
  .save.err{color:var(--warn)}
  .empty{padding:40px 0;text-align:center;color:var(--muted)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cuenta del cumple de Leti</h1>
    <div class="sub" id="sub">Cargando ticket…</div>
  </header>

  <div id="banner"></div>

  <div class="label">¿Quién eres?</div>
  <div class="people" id="people"></div>

  <div class="tabs">
    <button class="tab on" data-tab="items">Reclamar</button>
    <button class="tab" data-tab="resumen">Cuentas</button>
  </div>

  <div id="view-items"></div>
  <div id="view-resumen" class="hidden"></div>
</div>

<div class="bar" id="bar">
  <div class="wrap">
    <div>
      <div class="who" id="barWho">Elige tu nombre</div>
      <div class="amt" id="barAmt">—</div>
    </div>
    <div class="save" id="saveState"></div>
  </div>
</div>

<script>
/* ===== Configuración =====
   Si la página está en usuario.github.io/repo, owner y repo se detectan solos.
   Si usas otro dominio, llénalos a mano. */
const CONFIG = { owner: "", repo: "", branch: "main" };

const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

// --- Repo y token ---
(function detectRepo(){
  const h = location.hostname;
  if (!CONFIG.owner && h.endsWith(".github.io")) {
    CONFIG.owner = h.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    CONFIG.repo = CONFIG.repo || (seg && !seg.includes(".") ? seg : `${CONFIG.owner}.github.io`);
  }
})();
const hashK = new URLSearchParams(location.hash.slice(1)).get("k");
if (hashK) LS.set("cuenta-token", hashK);
const TOKEN = hashK || LS.get("cuenta-token");
const DEMO = !CONFIG.owner;   // sin repo: modo local de prueba (no sincroniza)

// --- Estado ---
let ticket = null;
let claims = {};          // { persona: { itemId: n } }
let shas = {};            // sha de cada archivo reclamos/<persona>.json
let me = LS.get("cuenta-yo");
let tab = "items";
let dirty = false, saveTimer = null, saving = false;

const $ = s => document.querySelector(s);
const money = n => "$" + n.toLocaleString("es-MX", {minimumFractionDigits:2, maximumFractionDigits:2});
const nombre = id => (ticket.comensales.find(c => c.id === id) || {}).nombre || id;

// --- GitHub API ---
const api = p => `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${p}`;
const headers = () => {
  const h = { "Accept": "application/vnd.github+json" };
  if (TOKEN) h["Authorization"] = "Bearer " + TOKEN;
  return h;
};
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));

async function readClaim(pid){
  if (DEMO) return JSON.parse(LS.get("demo-" + pid) || "{}");
  const r = await fetch(api(`reclamos/${pid}.json`) + `?ref=${CONFIG.branch}&t=${Date.now()}`, { headers: headers(), cache: "no-store" });
  if (r.status === 404) { shas[pid] = null; return {}; }
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  shas[pid] = j.sha;
  try { return JSON.parse(b64dec(j.content)) || {}; } catch(e){ return {}; }
}

async function writeClaim(pid, data, retry = true){
  if (DEMO) { LS.set("demo-" + pid, JSON.stringify(data)); return; }
  const body = {
    message: `Reclamos de ${nombre(pid)}`,
    content: b64enc(JSON.stringify(data, null, 2) + "\n"),
    branch: CONFIG.branch
  };
  if (shas[pid]) body.sha = shas[pid];
  const r = await fetch(api(`reclamos/${pid}.json`), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if ((r.status === 409 || r.status === 422) && retry) { await readClaim(pid); return writeClaim(pid, data, false); }
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  shas[pid] = j.content.sha;
}

async function loadAll(){
  const ids = ticket.comensales.map(c => c.id);
  const res = await Promise.all(ids.map(id => readClaim(id).catch(() => null)));
  ids.forEach((id, i) => {
    if (res[i] === null) return;            // error de red: conserva lo que había
    if (id === me && dirty) return;         // no pisar cambios propios sin guardar
    claims[id] = res[i];
  });
}

// --- Cálculo ---
function compute(){
  const ids = ticket.comensales.map(c => c.id);
  const leti = ticket.cumpleanera;
  const consumo = Object.fromEntries(ids.map(id => [id, 0]));
  const detalle = Object.fromEntries(ids.map(id => [id, []]));
  let sinReclamar = 0;
  const items = ticket.items.map(it => {
    const total = it.cantidad * it.precio;
    const por = ids.map(id => [id, +((claims[id] || {})[it.id] || 0)]).filter(([,n]) => n > 0);
    const suma = por.reduce((a, [,n]) => a + n, 0);
    let estado;
    if (suma === 0) { sinReclamar += total; estado = "pend"; }
    else if (suma <= it.cantidad) {
      por.forEach(([id, n]) => { const c = n * it.precio; consumo[id] += c; detalle[id].push([it, n, c]); });
      sinReclamar += (it.cantidad - suma) * it.precio;
      estado = suma === it.cantidad ? "ok" : "pend";
    } else {
      por.forEach(([id, n]) => { const c = total * n / suma; consumo[id] += c; detalle[id].push([it, n, c, true]); });
      estado = "share";
    }
    return { it, total, por, suma, estado };
  });
  const letiTotal = consumo[leti] + sinReclamar;
  const pagan = ids.filter(id => id !== leti);
  const parteLeti = letiTotal / pagan.length;
  const cuentas = {};
  ids.forEach(id => {
    const sub = id === leti ? 0 : consumo[id] + parteLeti;
    const prop = sub * ticket.propina;
    cuentas[id] = { consumo: consumo[id], parteLeti: id === leti ? 0 : parteLeti, sub, prop, total: sub + prop };
  });
  return { items, consumo, detalle, sinReclamar, letiTotal, parteLeti, cuentas, pagan };
}

// --- Render ---
function renderPeople(){
  $("#people").innerHTML = ticket.comensales.map(c =>
    `<button class="chip ${c.id === me ? "on" : ""}" data-p="${c.id}">${c.nombre}</button>`).join("");
}

function renderItems(r){
  const v = $("#view-items");
  if (!me) { v.innerHTML = `<div class="empty">Elige tu nombre arriba para marcar lo que consumiste.</div>`; return; }
  const puede = DEMO || !!TOKEN;
  v.innerHTML = r.items.map(({it, total, por, suma, estado}) => {
    const mine = +((claims[me] || {})[it.id] || 0);
    const st = estado === "ok" ? `<span class="status ok">Completo</span>`
      : estado === "share" ? `<span class="status share">Compartido</span>`
      : `<span class="status pend">${suma === 0 ? "Sin reclamar" : `Faltan ${it.cantidad - suma}`}</span>`;
    const tags = por.map(([id, n]) => `<span class="tag ${id === me ? "me" : ""}">${nombre(id)}${it.cantidad > 1 || n > 1 ? " · " + n : ""}</span>`).join("");
    return `<div class="item">
      <div class="row">
        <div class="grow">
          <div class="name">${it.nombre}</div>
          <div class="meta">${it.cantidad > 1 ? `${it.cantidad} × ${money(it.precio)} = ` : ""}${money(total)}</div>
        </div>
        <div class="stepper">
          <button data-i="${it.id}" data-d="-1" ${!puede || mine <= 0 ? "disabled" : ""} aria-label="Quitar">−</button>
          <span class="n">${mine}</span>
          <button data-i="${it.id}" data-d="1" ${!puede || mine >= it.cantidad ? "disabled" : ""} aria-label="Agregar">+</button>
        </div>
      </div>
      <div class="claims">${st}${tags}</div>
    </div>`;
  }).join("") + `<p class="muted small">Si algo lo compartieron, márquenlo todos los que lo tomaron y se divide en partes iguales. Lo que nadie reclame se suma a lo de Leti, que se reparte entre los ${r.pagan.length} demás.</p>`;
}

function renderResumen(r){
  const leti = ticket.cumpleanera;
  let html = "";
  if (me) {
    const c = r.cuentas[me];
    if (me === leti) {
      html += `<div class="card"><div class="muted small">Leti</div><div class="big">${money(0)}</div>
        <div class="muted small" style="margin-top:6px">¡Feliz cumpleaños! Tu parte (${money(r.letiTotal)}) la pagan los demás.</div></div>`;
    } else {
      html += `<div class="card"><div class="muted small">Te toca pagar, ${nombre(me)}</div><div class="big">${money(c.total)}</div>
        ${r.detalle[me].map(([it, n, cost, sh]) => `<div class="line"><span>${n > 1 ? n + " × " : ""}${it.nombre}${sh ? ' <span class="m">(compartido)</span>' : ""}</span><span>${money(cost)}</span></div>`).join("")}
        <div class="line sep"><span>Tu consumo</span><span>${money(c.consumo)}</span></div>
        <div class="line"><span>Tu parte de lo de Leti <span class="m">(${money(r.letiTotal)} ÷ ${r.pagan.length})</span></span><span>${money(c.parteLeti)}</span></div>
        <div class="line"><span>Propina ${Math.round(ticket.propina * 100)} %</span><span>${money(c.prop)}</span></div>
        <div class="line sep"><span>Total</span><span>${money(c.total)}</span></div></div>`;
    }
  }
  const tot = ticket.items.reduce((a, it) => a + it.cantidad * it.precio, 0);
  const sum = k => r.pagan.reduce((a, id) => a + r.cuentas[id][k], 0);
  html += `<div class="label">Todos</div><div class="card"><table>
    <tr><th>Quién</th><th>Consumo</th><th>+ Leti</th><th>Propina</th><th>Total</th></tr>
    ${ticket.comensales.map(({id}) => { const c = r.cuentas[id];
      return id === leti
        ? `<tr><td>${nombre(id)}</td><td class="muted">${money(r.consumo[id])}</td><td colspan="2" class="muted small">cumpleañera</td><td>${money(0)}</td></tr>`
        : `<tr><td>${nombre(id)}</td><td>${money(c.consumo)}</td><td>${money(c.parteLeti)}</td><td>${money(c.prop)}</td><td><b>${money(c.total)}</b></td></tr>`; }).join("")}
    <tr class="tot"><td>Total</td><td></td><td></td><td>${money(sum("prop"))}</td><td>${money(sum("total"))}</td></tr>
  </table>
  <div class="line sep"><span>Ticket</span><span>${money(tot)}</span></div>
  <div class="line"><span>Propina ${Math.round(ticket.propina * 100)} %</span><span>${money(tot * ticket.propina)}</span></div>
  <div class="line"><span>A pagar</span><span>${money(tot * (1 + ticket.propina))}</span></div>
  <div class="line"><span class="m">Lo de Leti: consumo ${money(r.consumo[leti])} + sin reclamar ${money(r.sinReclamar)}</span><span class="m">${money(r.letiTotal)}</span></div>
  </div>`;
  if (r.sinReclamar > 0) html = `<div class="banner warn">Hay ${money(r.sinReclamar)} sin reclamar. Por ahora se cuentan como de Leti y se reparten entre los demás.</div>` + html;
  $("#view-resumen").innerHTML = html;
}

function renderBar(r){
  if (!me) { $("#barWho").textContent = "Elige tu nombre"; $("#barAmt").textContent = "—"; return; }
  $("#barWho").textContent = me === ticket.cumpleanera ? "Leti, hoy no pagas" : `${nombre(me)} paga (con propina)`;
  $("#barAmt").textContent = money(r.cuentas[me].total);
}

function renderBanner(){
  let b = "";
  if (DEMO) b = `<div class="banner info">Modo de prueba local: los cambios se guardan solo en este navegador.</div>`;
  else if (!TOKEN) b = `<div class="banner warn">Estás en modo solo lectura. Abre la liga completa que se compartió por WhatsApp para poder reclamar.</div>`;
  $("#banner").innerHTML = b;
}

function render(){
  const r = compute();
  renderPeople(); renderItems(r); renderResumen(r); renderBar(r);
}

function setSave(t, err){ const s = $("#saveState"); s.textContent = t; s.className = "save" + (err ? " err" : ""); }

// --- Guardado ---
function scheduleSave(){
  dirty = true; setSave("Guardando…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 700);
}
async function doSave(){
  if (saving) { scheduleSave(); return; }
  saving = true;
  const pid = me, data = { ...(claims[pid] || {}) };
  Object.keys(data).forEach(k => { if (!data[k]) delete data[k]; });
  try { await writeClaim(pid, data); dirty = false; setSave("Guardado ✓"); }
  catch(e) { setSave("No se guardó, reintentando…", true); setTimeout(scheduleSave, 3000); }
  saving = false;
}

// --- Eventos ---
document.addEventListener("click", e => {
  const p = e.target.closest("[data-p]");
  if (p) {
    if (dirty && me) doSave();
    me = p.dataset.p; LS.set("cuenta-yo", me); render(); return;
  }
  const st = e.target.closest("[data-i]");
  if (st && me) {
    const it = ticket.items.find(x => x.id === st.dataset.i);
    const mine = claims[me] = claims[me] || {};
    mine[it.id] = Math.max(0, Math.min(it.cantidad, (mine[it.id] || 0) + (+st.dataset.d)));
    render(); scheduleSave(); return;
  }
  const t = e.target.closest("[data-tab]");
  if (t) {
    tab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
    $("#view-items").classList.toggle("hidden", tab !== "items");
    $("#view-resumen").classList.toggle("hidden", tab !== "resumen");
  }
});

// --- Arranque ---
(async function init(){
  try {
    ticket = await (await fetch("ticket.json", { cache: "no-store" })).json();
  } catch(e) { $("#sub").textContent = "No se pudo cargar ticket.json"; return; }
  if (me && !ticket.comensales.some(c => c.id === me)) me = null;
  const tot = ticket.items.reduce((a, it) => a + it.cantidad * it.precio, 0);
  $("#sub").textContent = `${new Date(ticket.fecha + "T12:00").toLocaleDateString("es-MX", {day:"numeric", month:"long"})} · Ticket ${money(tot)} + ${Math.round(ticket.propina*100)} % de propina`;
  renderBanner();
  render();
  try { await loadAll(); setSave(""); } catch(e) { setSave("Sin conexión con GitHub", true); }
  render();
  setInterval(async () => { if (!saving && !document.hidden) { await loadAll(); render(); } }, 15000);
  document.addEventListener("visibilitychange", async () => { if (!document.hidden) { await loadAll(); render(); } });
})();
</script>
</body>
</html>
